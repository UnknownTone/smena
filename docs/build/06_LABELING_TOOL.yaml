# SMENA — задание: инструмент ручной разметки элементов (для соседней сессии Claude Code)
# Формат: конфиг-ТЗ. Читать вместе с CLAUDE.md, docs/SPEC.md §3, docs/build/01_BUILD_BRIEF.md.
# Правило автора: ничего не делать без команды «делай». Общение — на русском.

task:
  name: labeling_tool
  version: 0.1
  date: 2026-10-16
  goal: >
    Автор вручную выбирает элементы на фото кликами. Результат (1) сразу заменяет автоматический выбор
    для рендера и (2) копится как разметка для будущей модели выбора элементов (вместо ручных правил auto_select).
  why_not_video: >
    Видеозапись ручного выделения не годится как данные: пришлось бы распознавать курсор и штрихи по кадрам.
    Клики в инструменте сразу дают маски и метки «элемент / не элемент».
  placement:
    now: окно «Редактор элементов» внутри программы SMENA (кнопка на вкладке ФОТО) — см. решения 5 и 6
    later: —

status_2026_10_17:   # реализовано (шаги 1–4 + обучение); шаг 5 — прогон с автором
  done: >
    Окно «Редактор элементов» — вкладка ФОТО → кнопка (smena/editor/window.py, canvas.py, data.py, sam_client.py);
    SAM-сервер — tools/prep/sam_server.py (загрузка ~10 с, маска по клику 0.04–0.3 с); признаки кандидатов —
    auto_select.cand_features → <кандидаты>/<фото>/features.json; ручной выбор — selection_manual.json рядом
    с авто-выбором (альбом: data/selection_manual.json); метки — data/labels/labels.jsonl; сборка —
    build_elements.py (extra, half, polarity, line_y, pause; только LaMa); обучение — smena/editor/train.py
    (логистическая регрессия, проверка по фото, сравнение с правилами) → data/labels/model.json;
    auto_select.py --model; «модель — при «Подготовить фото»» (настройка prep_use_model).
  next: прогон с автором на 56 фото альбома и London; когда ≥ 300 меток — оценить модель против правил

decisions_2026_10_16:   # ответы автора на замечания Claude к заданию; приоритет над текстом ниже
  - id: 1
    topic: стартовое состояние
    decision: стартовать с data/selection_56_v2.json (отбор v2, кеш cache/sel56v2), а не с selection_56.json
  - id: 2
    topic: имена фото
    decision: брать имена из папки как есть («NN - имя»); ключи selection-файлов уже переименованы под них
  - id: 3
    topic: элемент-кусок кандидата
    decision: >
      показывать и сохранять элементы вида {"n": <кандидат>, "box": [x0, y0, x1, y1]} (крупные горизонтальные
      куски, правило auto_select от 2026-10-16; с 2026-10-17 — с «рваным краем»: {"n", "box", "torn"}).
      Принято окончательно 2026-10-17 после рендера London v2 («всё ок, далее донастрою обучением»).
  - id: 4
    topic: любые наборы
    decision: папка фото и папка кандидатов — аргументами (не только 56 фото альбома; например London — 141 фото,
              кандидаты в London\_smena_cache\cands, auto-выбор в London\_smena_cache\selection.json)
  - id: 5
    topic: где работает инструмент и SAM 2 (исправлено 2026-10-16)
    decision: >
      Разметка и обучение — сразу внутри программы SMENA, отдельное окно «Редактор элементов»
      (открывается кнопкой со вкладки ФОТО; большое, можно на второй монитор, показ не прерывается).
      Без PyTorch в программе работают: клики по кандидатам, объединить/разделить, верх/низ, маска/прямоугольник,
      X/Y, пауза, линия, undo, автосохранение, labels.jsonl, обучение классификатора (numpy).
      SAM 2 по точке и LaMa («Собрать фото») — отдельный фоновый процесс из .venv-prep
      (tools/prep/sam_server.py: модель в памяти, запросы через stdin/stdout, как мост подготовки smena/prep/bridge.py).
  - id: 6
    topic: окружение (исправлено 2026-10-16)
    decision: >
      Окно — в .venv-smena (PySide6 там уже есть); в .venv-prep PySide6 НЕ ставить —
      там только SAM 2 / LaMa для фонового процесса. Отменяет environment.extra_packages ниже.
  - id: 7
    topic: автосохранение
    decision: запись во временный файл и подмена (атомарно) — файлы маленькие (JSON на десятки КБ), задержек нет;
              labels.jsonl — только дописывать

environment:
  python: "<папка проекта>\\.venv-prep\\Scripts\\python.exe"   # 3.12, torch cu126, SAM 2, LaMa — только фоновый процесс SAM/LaMa (решение 5)
  extra_packages: []                   # PySide6 в .venv-prep не нужен (решение 6): окно — в .venv-smena
  models:
    sam2_checkpoint: "vj\\models\\sam2\\sam2.1_hiera_base_plus.pt"
    sam2_config: "configs/sam2.1/sam2.1_hiera_b+.yaml"
    lama_checkpoint: "vj\\models\\torch\\hub\\checkpoints\\big-lama.pt"   # грузить через io.BytesIO (кириллица в пути!)
  gpu: NVIDIA RTX 3050 Laptop 4 GB (SAM 2 ~1.4 GB, LaMa ~1.1 GB)
  paths_have_cyrillic: true            # читать картинки через PIL, не через cv2.imread

inputs:
  photos_dir: "<папка фото>"     # 56 фото в корне папки
  candidates_dir: "vj\\cache\\sel54"          # <имя фото>/cands.npz (маски packbits), cands.json, cands.jpg
  auto_selection: "vj\\data\\selection_56_v2.json"   # автоматический выбор — стартовое состояние (решение 1)
  existing_code_to_reuse:
    - tools/prep/candidates.py       # загрузка кандидатов, MAX_SIDE=1280
    - tools/prep/auto_select.py      # признаки кандидата (score, made, detail, area, edges) — сохранять их в разметку
    - tools/prep/build_elements.py   # сборка элементов + LaMa из selection.json
    - tools/prep/prepare_photos.py   # describe(), composition_line(), save_preview()

ui:
  window: PySide6, одно окно; тема — тестовая «SMENA × Pip-Boy» (docs/build/02_UI_DESIGN.md), можно упрощённо
  layout:
    left: список фото (номер, имя, число элементов, статус ✓ размечено / ○ авто / — пауза)
    center: фото 1:1 или вписано; поверх — контуры кандидатов SAM 2 (тонкие, приглушённые) и выбранные элементы (заливка цвета, номер)
    right: список элементов фото (номер, верх/низ, маска/прямоугольник, полярность X/Y, из каких кандидатов), кнопки действий
  view_toggles: [кандидаты вкл/выкл, элементы вкл/выкл, композиционная линия, прозрачность заливки]

interactions:
  - action: клик ЛКМ по кандидату
    result: включить / выключить его как элемент (метка 1 / 0)
  - action: клик ЛКМ там, где кандидата нет
    result: SAM 2 по точке (SAM2ImagePredictor, point prompt) → новая маска → элемент; Shift+клик — добавить точку к той же маске, Alt+клик — отрицательная точка
  - action: выделить несколько элементов + кнопка «Объединить» (или клавиша G)
    result: один элемент из нескольких частей (неделим, SPEC §3.1)
  - action: кнопка «Разделить»
    result: вернуть части объединённого элемента
  - action: переключатель на элементе
    result: верх ↔ низ (переопределяет композиционную линию), маска ↔ прямоугольник, полярность X ↔ Y
  - action: кнопка «Пауза» (клавиша P)
    result: фото без элементов (только фон)
  - action: кнопка «Сбросить к авто»
    result: вернуть выбор auto_select для этого фото
  - action: перетаскивание композиционной линии
    result: поправить линию верх/низ (элементы пересчитываются по большей площади)
  - action: ← / → или PageUp / PageDown
    result: предыдущее / следующее фото; Space — отметить «проверено» и дальше
  - action: кнопка «Собрать фото» (клавиша B)
    result: "build_elements для этого фото (LaMa) и показ результата: фон без элементов + элементы"
limits:
  max_elements: 32         # было 7; решение 2026-10-17 (SPEC §3.1). Больше — предупреждение, не запрет
  min_elements: 0          # 0 = пауза
  target_time_per_photo: 20-40 с

autosave:
  when: после каждого действия (без кнопки «Сохранить»)
  undo: Ctrl+Z / Ctrl+Y (история на фото)

outputs:
  selection_file:
    path: "vj\\data\\selection_manual.json"
    format_compatible_with: tools/prep/build_elements.py
    schema: |
      {"<имя фото без расширения>": {
          "els": [[3], [5, 6]],            # элементы из кандидатов (номера cands.json, с 1)
          "extra": ["extra_1.png"],        # элементы из кликов SAM 2 — маски PNG в <candidates_dir>/<фото>/
          "rect": [2],                     # номера элементов (с 1, по порядку els, затем extra) — прямоугольником
          "half": {"1": "top"},            # ручное переопределение верх/низ
          "polarity": {"2": "X"},          # ручное переопределение полярности
          "line_y": 0.62,                  # ручная композиционная линия (доля высоты) или null
          "pause": false,
          "checked": true,                 # автор проверил фото
          "note": ""}}
    build_elements_change_needed: "поддержать ключи extra, half, polarity, line_y, pause (сейчас понимает els, rect, note)"
  training_log:
    path: "vj\\data\\labels\\labels.jsonl"        # одна строка = одно решение; только дописывать
    record: |
      {"ts": "...", "photo": "...", "cand": 7 | null, "mask": "extra_1.png" | null,
       "label": 1 | 0,                 # 1 — элемент, 0 — не элемент (явно выключен или авто-кандидат не выбран при checked)
       "source": "user" | "auto_kept",
       "group": [5, 6] | null,         # если объединён
       "half": "top|bottom", "shape": "mask|rect",
       "features": {"score":0.0,"made":0.0,"detail":0.0,"area":0.0,"edges":0,"fill":0.0},
       "genre": "architecture|people|nature|bw_film|night_neon|other"}   # жанр фото — выбирается в UI одной кнопкой
    note: >
      Для каждого фото с checked=true все кандидаты получают метку: выбранные — 1, остальные — 0.
      Так одно фото даёт ~10–24 примеров; 56 фото → 300–600.

training_later:   # не делать сейчас — только чтобы формат данных подходил
  model: небольшой классификатор кандидата (логистическая регрессия / градиентный бустинг) на features + эмбеддинге CLIP
  start_when: ≥ 300 меток, желательно из ≥ 3 жанров
  replace: правило отбора в auto_select.py (оставить правила как запасной вариант)
  eval: доля совпадений с ручным выбором на отложенных фото

acceptance:
  - открывает 56 фото из photos_dir с кандидатами из candidates_dir, стартовое состояние — selection_56.json
  - клик по кандидату включает/выключает элемент; клик в пустое место создаёт маску SAM 2 по точке < 1 с
  - объединение, верх/низ, маска/прямоугольник, пауза, линия — работают и сохраняются сразу
  - selection_manual.json собирается build_elements.py в кеш, рендер (tools/render/render_demo.py) его показывает
  - labels.jsonl пополняется при каждом решении; формат — как выше
  - работает на путях с кириллицей и пробелами

steps:   # предложить автору план и ждать «делай»
  - 1: доставить PySide6 в .venv-prep; каркас окна, список фото, показ фото с кандидатами и авто-выбором
  - 2: клики по кандидатам, автосохранение selection_manual.json, labels.jsonl
  - 3: SAM 2 по точке (extra-маски), объединение/разделение, верх/низ, маска/прямоугольник, пауза, линия, undo
  - 4: доработать build_elements.py (extra, half, polarity, line_y, pause); кнопка «Собрать фото»
  - 5: прогон с автором на 56 фото; затем перенести модуль во вкладку ФОТО программы SMENA
